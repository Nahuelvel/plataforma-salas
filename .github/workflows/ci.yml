name: CI
on:
  push: {branches: [main]}
  pull_request:
jobs:
  pruebas:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.12", cache: pip}
      - run: pip install -r requirements-dev.txt
      - run: ruff check .
      - run: python -m pytest   # PA-01 a PA-05 y flujo QR: se repiten en cada cambio (regresión)
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t plataforma-salas .
